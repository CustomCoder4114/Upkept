# Local development: postgres + redis + api + worker + beat (scheduler).
# Run from backend/:  docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: upkept
      POSTGRES_PASSWORD: upkept
      POSTGRES_DB: upkept
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upkept"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql+psycopg://upkept:upkept@postgres:5432/upkept
      REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./:/srv", "../content:/content", "files:/data/files"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *dbenv
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    volumes: ["./:/srv", "../content:/content"]
    depends_on: [postgres, redis]

  beat:
    # Exactly ONE beat process, ever. It only schedules; the worker does the sending.
    build: { context: .., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *dbenv
    command: celery -A app.workers.celery_app.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on: [redis]

volumes:
  pgdata:
  files:  # encrypted document files (when R2 isn't set up)
